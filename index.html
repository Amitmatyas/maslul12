<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שרירץ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>שרירץ</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Karantina:wght@400;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#0A0E1A; --ink2:#10162A; --ink3:#172038; --line:#232D4A; --line2:#33406A;
  --chalk:#F1F3F9; --mute:#8D97B3; --dim:#5B6584;
  --tartan:#FF5A3C; --easy:#35D3B0; --long:#A182FF; --iron:#FFC045; --pool:#3BB4FF; --rest:#8390B3;
  --quality:#FF5A3C; --swim:#3BB4FF; --bad:#FF4D6A;
  --display:'Karantina','Rubik',system-ui,sans-serif;
  --body:'Rubik','Heebo','Segoe UI',system-ui,sans-serif;
  --num:'Bebas Neue','Rubik',system-ui,sans-serif;
  --r:20px; --c:var(--tartan);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ink)}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 520px at 90% -10%, rgba(255,90,60,.15), transparent 60%),
             radial-gradient(800px 600px at -10% 110%, rgba(161,130,255,.13), transparent 60%)}
.bgfx::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 139px,rgba(255,255,255,.028) 139px 140px);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 75%);mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.app{position:relative;z-index:1;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,14,26,.95);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--chalk);flex:none}
.brand svg{width:40px;height:26px}
.brand .logo span{color:var(--tartan)}
.brand b{font-family:var(--display);font-size:34px;line-height:1;font-weight:700}
.badge{font-size:12px;color:var(--mute);border:1px solid var(--line2);padding:4px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge strong{color:var(--chalk);font-weight:600}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.ok i{background:var(--easy);box-shadow:0 0 8px var(--easy)}
.sync.busy i{background:var(--iron)}
.nav{display:flex;gap:2px;margin-inline-start:auto}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;color:var(--mute);text-decoration:none;font-size:14px;font-weight:500;transition:color .15s,background .15s;white-space:nowrap}
.nav a:hover{color:var(--chalk)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--chalk)}
.nav a .ic{width:18px;height:18px}
.gear{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line2);flex:none}
.gear:hover{color:var(--chalk)}

main{padding-block:24px 60px}
.stack{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:500}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:42px;line-height:.95;font-weight:700}
.h-xl{font-size:clamp(48px,8vw,80px)}
p{margin:0}
.muted{color:var(--mute)}
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}

.t-easy{--c:var(--easy)} .t-quality{--c:var(--tartan)} .t-long{--c:var(--long)} .t-iron{--c:var(--iron)} .t-swim{--c:var(--pool)} .t-rest{--c:var(--rest)}
.lv-green{--c:var(--easy)} .lv-yellow{--c:var(--iron)} .lv-orange{--c:var(--tartan)} .lv-red{--c:var(--bad)}

.hero{position:relative;overflow:hidden;border-radius:28px;padding:28px 28px 34px;
  background:radial-gradient(120% 150% at 100% 0%, color-mix(in srgb,var(--c) 24%, transparent), transparent 58%), var(--ink2);
  border:1px solid color-mix(in srgb,var(--c) 32%, var(--line));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:repeating-linear-gradient(90deg,var(--c) 0 30px,transparent 30px 46px);opacity:.55}
.hero-num{position:absolute;left:-6px;bottom:-56px;font-family:var(--num);font-size:280px;line-height:1;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--c) 30%, transparent);pointer-events:none;user-select:none}
.hero-main{position:relative;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(68px,13vw,128px);line-height:.82}
.hero h1 span{color:var(--c)}
.hero-date{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:15px}
.pill-today{background:var(--c);color:var(--ink);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;letter-spacing:.06em}
.hero-sum{font-size:19px;font-weight:600;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--chalk);background:rgba(255,255,255,.03);white-space:nowrap;text-decoration:none}
.chip.hot{border-color:var(--c);color:var(--c)}
.chip.sm{font-size:11.5px;padding:2px 8px}
.chip.lvl{border-color:var(--c);color:var(--c)}
.chip.lvl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.hero-side{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{width:132px;height:132px}
.ring .bg{stroke:var(--line2)} .ring .fg{stroke:var(--c);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:var(--chalk);font-family:var(--num)}
.ring .sub{fill:var(--mute);font-family:var(--body);font-size:11px}
.daynav{display:flex;gap:6px}
.iconbtn{height:36px;min-width:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--chalk);font-size:13px;background:rgba(255,255,255,.03)}
.iconbtn:hover{border-color:var(--chalk)}
.iconbtn[disabled]{opacity:.35;cursor:default}
@media (prefers-reduced-motion:no-preference){
  .hero h1{animation:slam .55s cubic-bezier(.2,.9,.2,1) both}
  .hero-num{animation:drift .9s cubic-bezier(.2,.9,.2,1) both}
}
@keyframes slam{from{transform:translateX(-40px);opacity:.2}to{transform:none;opacity:1}}
@keyframes drift{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}

.countdown{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-radius:var(--r);border:1px dashed var(--tartan);background:color-mix(in srgb,var(--tartan) 8%, var(--ink))}
.countdown h2{font-size:40px}
.cd-num{font-family:var(--num);font-size:92px;line-height:.8;color:var(--tartan)}

.golive{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-radius:var(--r);background:linear-gradient(100deg,color-mix(in srgb,var(--tartan) 26%,var(--ink2)),var(--ink2));border:1px solid color-mix(in srgb,var(--tartan) 45%,var(--line));color:var(--chalk);text-align:start;width:100%}
.golive b{font-family:var(--display);font-size:34px;line-height:.9;font-weight:700;display:block}
.golive span{font-size:13.5px;color:var(--mute)}
.golive .playc{width:58px;height:58px;border-radius:50%;background:var(--tartan);color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 0 0 8px color-mix(in srgb,var(--tartan) 18%,transparent)}
@media (prefers-reduced-motion:no-preference){.golive .playc{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--tartan) 6%,transparent)}}

.adapt{border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--c) 9%,var(--ink2)),var(--ink2) 60%)}
.adapt h3{font-family:var(--display);font-size:34px;line-height:.9;font-weight:700;color:var(--c)}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.alist li{display:flex;gap:9px}
.alist li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c);flex:none;margin-top:8px}
.alist.good li::before{background:var(--easy)}
.alist.chg li::before{background:var(--chalk)}
.acols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin-top:14px}
.acols h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:500}

.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--ink2);color:var(--chalk);min-width:0;position:relative}
.sd:hover{border-color:var(--line2)}
.sd .dn{font-size:12px;color:var(--mute)}
.sd .dd{font-family:var(--num);font-size:22px;line-height:1}
.sd .dots{display:flex;gap:3px;height:6px}
.sd .dots i{width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.35}
.sd .dots i.on{opacity:1;box-shadow:0 0 8px var(--c)}
.sd.sel{border-color:var(--chalk);background:var(--ink3)}
.sd.is-today::after{content:"";position:absolute;top:6px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--tartan)}
.sd.all-done{background:color-mix(in srgb,var(--easy) 12%, var(--ink2));border-color:color-mix(in srgb,var(--easy) 45%, var(--line))}

.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.block{position:relative;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 11%, var(--ink2)),var(--ink2) 55%);
  border:1px solid color-mix(in srgb,var(--c) 26%, var(--line));border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:box-shadow .3s,border-color .3s}
.block.is-done{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,0 18px 50px -28px var(--c)}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--c)}
.tag .ic{width:18px;height:18px}
.state{font-size:12px;color:var(--mute)}
.block.is-done .state{color:var(--c);font-weight:600}
.block h3{font-family:var(--display);font-size:44px;line-height:.9;font-weight:700}
.block h3 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--mute);margin-inline-start:6px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bignum{font-family:var(--num);font-size:64px;line-height:.85;color:var(--c);direction:ltr;unicode-bidi:isolate}
.unit{font-size:16px;color:var(--mute);font-weight:500}
.lead{font-size:15.5px}
.hint{font-size:13.5px;color:var(--mute)}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--chalk)}
.note b{color:var(--c)}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;direction:ltr}
.meter span{height:9px;border-radius:3px;background:var(--line)}
.meter span.on{background:var(--c);box-shadow:0 0 10px -2px var(--c)}
.meter-row{display:flex;flex-direction:column;gap:6px}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto auto auto;gap:6px}
.flow li{padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);display:flex;flex-direction:column;gap:2px;min-width:0}
.flow li b{font-size:12px;color:var(--mute);font-weight:500}
.flow li span{font-weight:600;font-size:14px}
.flow li.main{border-color:var(--c)}
.flow li.main span{color:var(--c)}
.runlog{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.18)}
.pace{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.pace b{color:var(--chalk);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.lifts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lift{padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:9px;min-width:0}
.lift.full{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.lt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lt b{font-weight:600;font-size:15.5px}
.lt .rx{font-size:13px;color:var(--mute);direction:ltr;unicode-bidi:isolate}
.eqsel{background:var(--ink);border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--chalk);max-width:100%}
.rec{font-size:12.5px;color:var(--mute);line-height:1.45}
.rec b{color:var(--chalk);font-weight:600}
.rec.up b{color:var(--easy)} .rec.down b{color:var(--long)}
.lrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.wbox input{width:72px;text-align:center}
.reps{display:flex;gap:6px;flex-wrap:wrap}
.rep{width:48px;height:42px;text-align:center;border-radius:11px;border:2px solid color-mix(in srgb,var(--c) 40%,var(--line2));background:var(--ink);color:var(--chalk);font-family:var(--num);font-size:21px;padding:0}
.rep.on{background:var(--c);color:var(--ink);border-color:var(--c)}
.rep::placeholder{color:var(--dim)}
.feel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.feel button{padding:5px 11px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--mute)}
.feel button.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ck{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.ck .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.ck.on .box{background:var(--c);border-color:var(--c)}
.ck.on .box::after{content:"";width:9px;height:5px;border:2.5px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck .txt{flex:1;min-width:0}
.ck .dur{font-size:12.5px;color:var(--mute);white-space:nowrap}
.ck.on .txt{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--c)}
.ck.pain{--c:var(--bad)}
.ck.pain.on .txt{text-decoration:none;color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.km{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.inp{background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;width:96px;font-variant-numeric:tabular-nums;color:var(--chalk)}
.inp.sm{width:80px}
.inp:focus{border-color:var(--chalk);outline:none}
textarea.inp{width:100%;min-height:80px;resize:vertical}
.donebtn{width:100%;padding:14px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--c) 60%, var(--line2));color:var(--c);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.donebtn:hover{background:color-mix(in srgb,var(--c) 10%, transparent)}
.block.is-done .donebtn{background:var(--c);color:var(--ink);border-style:solid;border-color:var(--c)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--c);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.4;cursor:default}
.ghost{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);font-size:14px;font-weight:500;color:var(--chalk);text-decoration:none}
.ghost:hover{border-color:var(--chalk)}
.ghost.sm{padding:7px 11px;font-size:13px}

.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.tips{display:flex;flex-direction:column;gap:10px}
.tip{display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.tip .ic{color:var(--tartan);margin-top:2px}
.redflag{border-color:color-mix(in srgb,var(--bad) 40%, var(--line));background:color-mix(in srgb,var(--bad) 6%, var(--ink2))}
.redflag strong{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field>span{font-size:13px;color:var(--mute)}
.scale{display:flex;gap:5px;flex-wrap:wrap;direction:ltr}
.scale button{min-width:36px;height:36px;padding:0 8px;border-radius:10px;border:1px solid var(--line2);font-family:var(--num);font-size:18px;color:var(--mute)}
.scale button.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.scale.rpe button.on{background:var(--tartan);border-color:var(--tartan)}
.scale-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);direction:ltr;max-width:320px}
.ready-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:4px 20px}
.sugg{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 8%,transparent);margin-top:6px}
.sugg p{flex:1;min-width:220px;font-size:14px}

.weekhead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.weekhead h1{font-family:var(--display);font-size:clamp(60px,10vw,96px);line-height:.85;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--ink2);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--num);font-size:42px;line-height:.9;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;unicode-bidi:isolate}
.kpi .l{font-size:12.5px;color:var(--mute)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.dc{text-align:start;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--ink2);color:var(--chalk);min-width:0;position:relative;overflow:hidden}
.dc:hover{border-color:var(--line2)}
.dc .top-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dc .dn{font-family:var(--display);font-size:34px;line-height:.9;font-weight:700}
.dc .dt{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.dc .ses{display:flex;flex-direction:column;gap:6px}
.sline{display:flex;align-items:center;gap:8px;font-size:13.5px}
.sline i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.sline.done{color:var(--mute)}
.sline.done i{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%, transparent)}
.dc.is-today{border-color:var(--tartan)}
.dc.all-done{background:color-mix(in srgb,var(--easy) 9%, var(--ink2));border-color:color-mix(in srgb,var(--easy) 40%, var(--line))}
.dc .ok{position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;color:var(--easy);letter-spacing:.08em}

.track{width:100%;height:auto;display:block}
.track .lane{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1}
.track .base{fill:none;stroke:color-mix(in srgb,var(--tartan) 18%, var(--ink3));stroke-width:34}
.track .seg{fill:none;stroke-width:16;stroke:var(--line2);cursor:pointer;transition:stroke .2s}
.track .seg.past{stroke:color-mix(in srgb,var(--easy) 70%, var(--ink3))}
.track .seg.cur{stroke:var(--tartan)}
.track .seg:hover{stroke:var(--chalk)}
.track .wl{fill:var(--mute);font-family:var(--num);font-size:15px;text-anchor:middle;dominant-baseline:central}
.track .wl.cur{fill:var(--chalk)}
.track .wl.dl{fill:var(--long)}
.track .infield{fill:color-mix(in srgb,var(--easy) 6%, var(--ink2));stroke:rgba(255,255,255,.06)}
.track .big{fill:var(--chalk);font-family:var(--num);font-size:70px;text-anchor:middle}
.track .cap{fill:var(--mute);font-family:var(--body);font-size:12px;text-anchor:middle}
.track .runner{fill:var(--chalk)}
.track .halo{fill:var(--tartan);opacity:.35}
@media (prefers-reduced-motion:no-preference){.track .halo{animation:halo 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes halo{from{transform:scale(.6);opacity:.6}to{transform:scale(2.2);opacity:0}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:2px;display:inline-block}
.wtable{width:100%;border-collapse:collapse;font-size:14px}
.wtable th{text-align:start;font-size:11.5px;color:var(--mute);font-weight:500;letter-spacing:.08em;padding:0 8px 8px}
.wtable td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
.wtable tr.cur td{background:color-mix(in srgb,var(--tartan) 8%, transparent)}
.wtable tbody tr{cursor:pointer}
.wtable tbody tr:hover td{background:rgba(255,255,255,.03)}
.wn{font-family:var(--num);font-size:30px;line-height:1;width:44px}
.mini-bar{width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--easy)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}

.live-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.live-top h2{font-size:clamp(36px,7vw,58px)}
.tface{--c:var(--easy);display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 18px;border-radius:28px;background:radial-gradient(80% 70% at 50% 35%, color-mix(in srgb,var(--c) 16%, transparent), transparent 70%),var(--ink2);border:1px solid color-mix(in srgb,var(--c) 30%, var(--line));transition:border-color .3s;min-width:0}
.tface[data-k="work"]{--c:var(--tartan)} .tface[data-k="warm"]{--c:var(--easy)} .tface[data-k="rest"]{--c:var(--pool)} .tface[data-k="cool"]{--c:var(--long)} .tface[data-k="done"]{--c:var(--iron)} .tface[data-k="set"]{--c:var(--iron)} .tface[data-k="run"]{--c:var(--easy)} .tface[data-k="long"]{--c:var(--long)} .tface[data-k="swim"]{--c:var(--pool)} .tface[data-k="log"]{--c:var(--iron)}
.tring{width:min(100%,320px);aspect-ratio:1;position:relative;max-width:100%}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .bg{stroke:var(--line);fill:none}
.tring .fg{stroke:var(--c);fill:none;stroke-linecap:round;transition:stroke .3s}
.tring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:40px}
.tname{font-family:var(--display);font-size:36px;line-height:.9;font-weight:700;color:var(--c)}
.ttime{font-family:var(--num);font-size:clamp(72px,18vw,108px);line-height:.85;font-variant-numeric:tabular-nums;direction:ltr}
.tsub{font-size:13px;color:var(--mute);max-width:230px}
.tface.running[data-k="work"] .tring{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--tartan) 55%, transparent))}
.tnext{font-size:14px;color:var(--mute);text-align:center}
.tnext b{color:var(--chalk);font-weight:600}
.tctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tbtn{height:58px;min-width:58px;padding:0 24px;border-radius:999px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);color:var(--chalk)}
.tbtn.go{background:var(--c);color:var(--ink);border-color:var(--c);min-width:160px}
.tbtn[disabled]{opacity:.35;cursor:default}
.tline{display:flex;gap:2px;height:14px;width:100%}
.tline span{border-radius:3px;background:var(--line);min-width:3px}
.tline span[data-k="work"]{background:color-mix(in srgb,var(--tartan) 40%, var(--ink3))}
.tline span[data-k="warm"],.tline span[data-k="run"]{background:color-mix(in srgb,var(--easy) 32%, var(--ink3))}
.tline span[data-k="long"]{background:color-mix(in srgb,var(--long) 35%, var(--ink3))}
.tline span[data-k="rest"],.tline span[data-k="swim"]{background:color-mix(in srgb,var(--pool) 28%, var(--ink3))}
.tline span[data-k="cool"]{background:color-mix(in srgb,var(--long) 30%, var(--ink3))}
.tline span[data-k="set"]{background:color-mix(in srgb,var(--iron) 40%, var(--ink3))}
.tline span.past{opacity:.3}
.tline span.now{outline:2px solid var(--chalk);outline-offset:1px}
.tmeta{display:flex;justify-content:space-between;width:100%;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.coachb{display:flex;gap:12px;align-items:flex-start;width:100%;max-width:560px;padding:14px 16px;border-radius:18px;background:var(--ink3);border:1px solid var(--line2)}
.coachb .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c);color:var(--ink);font-family:var(--display);font-size:22px;font-weight:700}
.coachb p{font-size:16px;font-weight:500;line-height:1.45;min-height:1.4em}
.setcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:100%}
.setcard .exn{font-family:var(--display);font-size:clamp(48px,11vw,80px);line-height:.85;font-weight:700;color:var(--c)}
.setcard .setn{font-family:var(--num);font-size:30px;color:var(--chalk);letter-spacing:.04em}
.wctl{display:flex;align-items:center;gap:12px}
.wctl .wv{font-family:var(--num);font-size:54px;line-height:1;min-width:90px;text-align:center;direction:ltr}
.wctl .wu{font-size:12px;color:var(--mute)}
.rchips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr}
.rchips button{width:58px;height:58px;border-radius:16px;border:2px solid color-mix(in srgb,var(--c) 45%,var(--line2));font-family:var(--num);font-size:28px;color:var(--chalk)}
.rchips button.tgt{background:color-mix(in srgb,var(--c) 18%,transparent)}
.rchips button:active{transform:scale(.94)}
.feelbig{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.feelbig button{padding:16px 22px;border-radius:16px;border:1px solid var(--line2);font-size:16px;font-weight:600;min-width:120px}
.feelbig button small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.wpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wpick button{height:44px;border-radius:12px;border:1px solid var(--line2);font-family:var(--num);font-size:22px;color:var(--mute)}
.wpick button:hover{border-color:var(--chalk);color:var(--chalk)}
.wpick button.dl{color:var(--long)}
.launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.lcard{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:linear-gradient(165deg,color-mix(in srgb,var(--c) 10%,var(--ink2)),var(--ink2) 60%);text-align:start;color:var(--chalk)}
.lcard b{font-family:var(--display);font-size:38px;line-height:.9;font-weight:700}
.lcard span{font-size:13.5px;color:var(--mute)}
.lcard .cta{align-self:flex-start}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-child{border-top:0}
.switch{width:46px;height:26px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--chalk);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--easy)}
.switch[aria-checked="true"]::after{transform:translateX(-20px)}
.seg3{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.seg3 button{padding:8px 14px;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.seg3 button.on{background:var(--chalk);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{font-family:var(--num);font-size:28px;min-width:44px;text-align:center}

.chat{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.chatbox{display:flex;flex-direction:column;gap:14px;min-height:60vh}
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(620px,92%);padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.6;white-space:normal;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--chalk);color:var(--ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-end;background:var(--ink3);border:1px solid var(--line2);border-bottom-left-radius:6px}
.msg.ai .who{font-size:11.5px;letter-spacing:.12em;color:var(--tartan);font-weight:600;margin-bottom:4px}
.msg ul{margin:6px 0;padding-inline-start:18px}
.msg.err{border-color:color-mix(in srgb,var(--bad) 50%,var(--line2))}
.chatform{display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink2);border:1px solid var(--line2);border-radius:18px;padding:10px}
.chatform textarea{flex:1;min-height:48px;max-height:160px;border:0;background:transparent;resize:none;padding:8px;outline:none;color:var(--chalk)}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchips button{font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--chalk);text-align:start}
.qchips button:hover{border-color:var(--tartan)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute)}
@media (prefers-reduced-motion:no-preference){.typing i{animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}}
@keyframes blink{50%{opacity:.25}}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--dim);font-size:11px;font-family:var(--body)}
.chart .band{fill:color-mix(in srgb,var(--tartan) 14%, transparent);stroke:color-mix(in srgb,var(--tartan) 50%, transparent);stroke-dasharray:3 3}
.chart .bar{fill:var(--easy)}
.chart .bar.cur{fill:var(--tartan)}
.chart .xl{fill:var(--mute);font-family:var(--num);font-size:15px;text-anchor:middle}
.chart .xl.cur{fill:var(--chalk)}
.chart .val{fill:var(--chalk);font-family:var(--num);font-size:13px;text-anchor:middle}
.chart .pline{fill:none;stroke:var(--easy);stroke-width:2.5;stroke-linejoin:round}
.chart .parea{fill:color-mix(in srgb,var(--easy) 12%,transparent)}
.chart .pdot{fill:var(--ink2);stroke:var(--easy);stroke-width:2}
.chart .pdot.lg{stroke:var(--long)}
.chart .pend{fill:var(--easy)}
.entries{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:start;width:100%;color:var(--chalk)}
.entry:first-child{border-top:0}
.entry .ed{font-size:13px;color:var(--mute)}
.entry .ed b{display:block;color:var(--chalk);font-size:14px}
.entry .en{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .es{display:flex;gap:4px;flex-wrap:wrap}
.entry .rpe{font-family:var(--num);font-size:22px;color:var(--tartan);min-width:40px;text-align:center}
.empty{padding:26px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:16px}
.imp{display:flex;flex-direction:column;gap:10px}
.improw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line)}
.improw b{font-family:var(--num);font-size:22px;font-weight:400;direction:ltr}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;border:2px dashed var(--line2);border-radius:16px;text-align:center;color:var(--mute)}
.drop.over{border-color:var(--tartan);color:var(--chalk)}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.goal{display:flex;flex-direction:column;gap:14px}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal h3{font-family:var(--display);font-size:40px;line-height:.9;font-weight:700}
.goal .gv{display:flex;align-items:end;gap:12px;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.goal .now{font-family:var(--num);font-size:56px;line-height:.85}
.goal .arrow{color:var(--dim);font-size:24px;line-height:1.6}
.goal .tgt{font-family:var(--num);font-size:56px;line-height:.85;color:var(--tartan)}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--line)}
.gbar i{position:absolute;inset-block:0;right:0;border-radius:5px;background:linear-gradient(270deg,var(--easy),var(--tartan))}
.gmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--mute)}
.gmeta b{display:block;color:var(--chalk);font-family:var(--num);font-size:24px;font-weight:400;direction:ltr;text-align:right}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.zone{padding:14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 35%, var(--line));background:color-mix(in srgb,var(--c) 7%, var(--ink2));display:flex;flex-direction:column;gap:4px}
.zone b{color:var(--c);font-size:13px}
.zone .zp{font-family:var(--num);font-size:34px;line-height:1;direction:ltr;text-align:right}
.zone span{font-size:12.5px;color:var(--mute)}
.journey{position:relative;height:34px;border-radius:10px;background:repeating-linear-gradient(270deg,var(--line) 0 calc(100%/6 - 3px),transparent calc(100%/6 - 3px) calc(100%/6))}
.journey i{position:absolute;inset-block:0;right:0;width:calc(100%/6 - 3px);border-radius:10px 4px 4px 10px;background:var(--tartan)}
.journey em{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--chalk);border-radius:2px}
.journey-l{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:8px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.rules ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:10px;font-size:14.5px}
.rules li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c);flex:none;margin-top:8px}
.rules h3{font-family:var(--display);font-size:34px;line-height:.9;font-weight:700;margin-bottom:14px;color:var(--c)}

.bt{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.bt .big{gap:6px}
.actrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actrow>*{width:100%;justify-content:center}
.actrow .donebtn{padding:12px 10px}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;list-style:none;font-size:13.5px;color:var(--mute);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0}
details.more>summary::-webkit-details-marker,details.adl>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"▾";font-size:14px;transition:transform .2s}
details.more[open]>summary::after{transform:rotate(180deg)}
.more-in{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.logp{padding:14px 18px}
.logp details.more{border-top:0;padding-top:0}
.logp details.more>summary{font-size:15px;color:var(--chalk);font-weight:500}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:minmax(0,1fr) auto 76px;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.exlist li:last-child{border-bottom:0}
.exlist .s{color:var(--mute);font-size:13px;direction:ltr;unicode-bidi:isolate}
.exlist .w{font-family:var(--num);font-size:22px;color:var(--c);text-align:left;direction:ltr;white-space:nowrap}
.exlist .w small{font-family:var(--body);font-size:11px;color:var(--mute);margin-left:3px}
.exlist .up{color:var(--easy);font-weight:700}
.exlist li.on .n{text-decoration:line-through;text-decoration-color:var(--c);color:var(--mute)}
.nudge{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;border:1px solid color-mix(in srgb,var(--iron) 50%,var(--line));background:color-mix(in srgb,var(--iron) 9%,var(--ink2));--c:var(--iron)}
.nudge p{font-size:15.5px}
.nudge b{color:var(--iron)}
.readyline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--ink2);font-size:14px;color:var(--mute);flex-wrap:wrap}
.readyline b{color:var(--chalk);font-weight:600}
.linkbtn{color:var(--chalk);text-decoration:underline;text-underline-offset:3px;font-size:13px;cursor:pointer;white-space:nowrap}
.tipline{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mute)}
.tipline .ic{color:var(--tartan);margin-top:1px}
.flagline{font-size:13px;color:color-mix(in srgb,var(--bad) 75%,var(--chalk))}
details.adl{padding:12px 16px}
details.adl>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14.5px}
details.adl .adh{flex:1;min-width:0}
details.adl[open]>summary{margin-bottom:6px}

  else if(met(last))why='עמדת ביעד באימון הקודם. עוד אימון אחד כזה — ועולים.';
  else if(miss(last)&&prev&&miss(prev)&&usesW){w=Math.max(0,roundTo(eq==='as'?last.w+step:last.w*0.9,step));up=-1;why='פעמיים ברצף היה קשה או חסרו חזרות → מורידים קצת ובונים שוב.'}
  else if(miss(last))why='באימון הקודם היה קשה. נשארים באותו משקל ומכוונים לטכניקה נקייה.';
  else why=`אותו משקל. מנסים להוסיף חזרה בכל סט, עד ${hi}.`;
  if(isDeload(week)&&usesW&&w!=null){w=Math.max(0,roundTo(eq==='as'?w+step:w*0.85,step));up=-1;why='שבוע הקלה: משקל קל יותר וסט אחד פחות.'}
  else if(lv>=2&&up>0&&usesW){w=last.w;up=0;why='השבוע מורידים עומס, אז לא עולים במשקל.'}
  const AX=aiAdj(week,lv);const af=AX&&AX.wt[k];if(af&&usesW&&w!=null&&!isDeload(week)){const nw=Math.max(0,roundTo(w*af,step));if(nw!==w){why+=` · AI: ${af<1?'מורידים':'מעלים'} ל-${fmtKg(nw)} ק״ג.`;up=nw>w?1:-1;w=nw}}
  return {w,why,up,usesW,eq,E};
}

  if(!bad)return e.easyMode?{lv:'yellow',text:'הגרסה הקלה פעילה.',btn:true}:null;
  const hard=[0,1,3,5,6].includes(I.dow);
  return {lv:'yellow',text:hard?'שינה חלשה או רגליים כבדות. מומלצת גרסה קלה: אימון איכות הופך לריצה קלה, ריצה ארוכה מתקצרת, ובכוח סט אחד פחות.':'יום קל ממילא. להקשיב לגוף ולשמור על מאמץ נמוך.',btn:hard||!!e.easyMode}}
function sugg(sg,d){const e=peek(d);return `<div class="sugg lv-${sg.lv}"><p>${sg.text}</p>${sg.btn?`<button class="cta" data-act="easy-mode" data-d="${d}">${e.easyMode?'חזור לתוכנית הרגילה':'עבור לגרסה קלה'}</button>`:''}</div>`}
function readyCard(d,I){const e=peek(d);const sg=readySuggest(d,I);

   ${sg?sugg(sg,d):''}</section>`}
const blkName=b=>b.type==='iron'?b.title:T_LABEL[b.type];
function nudges(d,I){let h='';const hr=new Date().getHours();

function dayView(d,I){

function stadiumPt(s,r){const L=336+2*Math.PI*r;s=((s%L)+L)%L;

  if(s<168)return [116+s,120+r];s-=168;
  if(s<Math.PI*r){const a=s/r;return [284+r*Math.sin(a),120+r*Math.cos(a)]}s-=Math.PI*r;
  return [284-s,120-r]}

const COACH_RULES=`אתה "המאמן" באפליקציית האימונים "שרירץ". אתה מאמן ריצה וכוח של נער בן 14. ענה תמיד בעברית, בגובה העיניים, חם ומעודד כמו מאמן אמיתי, קצר וברור (עד כ-150 מילים, אלא אם ביקשו פירוט). אפשר רשימות קצרות.

- לא ממליצים על תוספי תזונה, דיאטות, ירידה במשקל או צום. אפשר לדבר על אכילה מספקת, שתייה ושינה של 8–10 שעות.
- לא מעלים נפח מעבר לתוכנית. כשיש ספק — פחות. שבוע קל הוא חלק מהתוכנית.
- לא רצים לפי קצב היעד העתידי (39:50) כאילו הוא הקצב הנוכחי; עצימות לפי תחושת מאמץ.
- מומלץ שמאמן ריצה אנושי שמכיר בני נוער ילווה את התהליך; אתה לא מחליף אותו.

    if(e.rpe)parts.push('מאמץ '+e.rpe);if(e.sleep)parts.push('שינה '+e.sleep+'/5');if(e.sore)parts.push('עייפות '+e.sore+'/5');if(e.pain)parts.push('דיווח על כאב');if(e.easyMode)parts.push('גרסה קלה');if(e.note)parts.push('הערה: '+String(e.note).slice(0,120));

function paceChart(){const runs=runsIn('2000-01-01','2999-01-01',true);if(runs.length<2)return `<div class="empty">אחרי 2 ריצות קלות או ארוכות עם מרחק וזמן יופיע כאן גרף הקצב. הגרף עוזר לזהות אם הריצות הקלות נהיות איטיות לאורך זמן (סימן לעייפות) או מהירות יותר (התקדמות).</div>`;
  const W=640,H=220,pl=46,pr=14,pt=16,pb=30;const ps=runs.map(r=>r.pace);let lo=Math.min(...ps),hi=Math.max(...ps);const padv=Math.max(10,(hi-lo)*.15);lo=Math.floor((lo-padv)/15)*15;hi=Math.ceil((hi+padv)/15)*15;
  const d0=runs[0].d,dn=Math.max(1,diffDays(d0,runs[runs.length-1].d));const x=d=>W-pr-(W-pl-pr)*diffDays(d0,d)/dn;const y=p=>pt+(H-pt-pb)*(p-lo)/(hi-lo);
  let g='';const stepv=Math.max(15,Math.ceil((hi-lo)/4/15)*15);for(let v=lo;v<=hi;v+=stepv)g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${mmss(v)}</text>`;
  const pts=runs.map(r=>[x(r.d),y(r.pace),r]);const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)},${H-pb} L${pts[0][0].toFixed(1)},${H-pb} Z`;
  const dots=pts.map(([px,py,r],i)=>`<circle class="${i===pts.length-1?'pend':'pdot'} ${r.bid==='long'?'lg':''}" cx="${px}" cy="${py}" r="${i===pts.length-1?5.5:4}"><title>${fmtDM(r.d)}: ${mmss(r.pace)}/ק״מ · ${r1(r.km)} ק״מ</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="קצב הריצות הקלות לאורך זמן">${g}<path class="parea" d="${area}"/><path class="pline" d="${path}"/>${dots}<text class="axis" x="${W-pr}" y="${H-8}" text-anchor="end">${fmtShort(d0)}</text><text class="axis" x="${pl}" y="${H-8}" text-anchor="start">${fmtShort(runs[runs.length-1].d)}</text></svg>`}

  else if(isIOS()&&!isStandalone())body=`<ol class="steps"><li>ב-Safari: כפתור השיתוף (ריבוע עם חץ) → <b>הוסף למסך הבית</b>.</li><li>פותחים את <b>שרירץ</b> מהמסך הבית, וחוזרים לכאן (גלגל השיניים).</li></ol>`;
  else if(!('PushManager' in window))body='<p class="hint">המכשיר הזה לא תומך בהתראות.</p>';
  else if(!PUSH.checked)body='<p class="hint">בודק…</p>';
  else if(!PUSH.sub||Notification.permission!=='granted')body=`<p class="hint">בבוקר מגיעה התראה עם האימון של היום. בערב, אם היום עוד לא סומן, מגיעה תזכורת לעשות או לסמן.</p><button class="cta" data-act="push-enable" style="margin-top:10px">${ic('today')}הפעל התראות</button>`;
  else body=`<p style="color:var(--easy);font-weight:600">✓ ההתראות פעילות</p><button class="ghost" data-act="push-test" style="margin-top:10px">התראת בדיקה</button>`;
  return `<div class="remind" id="pushsec" style="border-color:color-mix(in srgb,var(--easy) 45%,var(--line2))"><span class="eyebrow">התראות</span><div style="margin-top:10px">${body}</div></div>`}
function badge(){const I=info(todayIso());const el=$('#badge');
  if(I.st==='before')el.innerHTML=`מתחילים בעוד <strong>${-I.n}</strong> ימים`;
  else if(I.st==='after')el.innerHTML=`<strong>מחזור 1 הושלם</strong>`;
  else el.innerHTML=`שבוע <strong>${I.week}</strong>/12 · יום <strong>${I.n+1}</strong>`}
function nav(){$('#nav').innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" ${V.view===k?'aria-current="page"':''} title="${l}">${ic(k)}<span>${l}</span></a>`).join('')}
function render(){const fn={today:viewToday,week:()=>viewWeek()+'<div style="height:36px"></div>'+viewPlan(),live:viewLive,chat:viewChat,journal:()=>viewJournal()+'<div style="height:36px"></div>'+viewGoals()}[V.view];
  $('#view').innerHTML=fn();badge();nav();paintSync();if(V.view==='live')paintLive();paintPill();
  if(V.lastView!==V.view){window.scrollTo(0,0);V.lastView=V.view;if(V.view==='chat')setTimeout(scrollChat,30)}
  if(V.scrollTo){const el=document.getElementById(V.scrollTo);V.scrollTo=null;if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),30)}}
function route(){let h=location.hash.slice(1);if(h==='rules')V.scrollTo='rules';h=ALIAS[h]||h;V.view=VIEWS.some(v=>v[0]===h)?h:'today';render()}
function go(view){if(location.hash.slice(1)===view)render();else location.hash=view}
window.addEventListener('hashchange',route);
let rw=innerWidth<900;window.addEventListener('resize',()=>{const n=innerWidth<900;if(n!==rw){rw=n;nav()}});
$('.gear').innerHTML=ic('gear');

function completeCheck(d,before){if(!before&&dayDone(d)){confetti();fanfare();vib([120,60,120]);toast(d===todayIso()?'היום הושלם. כל הכבוד!':'היום סומן כהושלם')}}
function liftFull(d,blk){const e=peek(d);return blk.ex.every(x=>{const l=e.lifts[x.k];return l&&l.reps&&l.reps.slice(0,x.s).filter(r=>r>0).length>=x.s})}
function recordSet(d,k,s,reps,w){if(!d)return;const e=ent(d);const l=e.lifts[k]||(e.lifts[k]={reps:[]});l.eq=equipOf(k);if(!Array.isArray(l.reps))l.reps=[];l.reps[s]=reps;if(w!=null&&w!==''&&!isNaN(+w))l.w=+w;
  const I=info(d);if(I.st==='in'){for(const blk of blocksFor(I.week,I.dow,d))if(blk.type==='iron'&&blk.ex.some(x=>x.k===k)&&liftFull(d,blk)&&!e.done[blk.id]){const before=dayDone(d);e.done[blk.id]=true;save();toast(`${blk.title} הושלם!`);completeCheck(d,before);return true}}
  save();return false}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;ac();
  const act=a.dataset.act,d=a.dataset.d;
  switch(act){
    case 'sel':V.sel=a.dataset.date;go('today');break;
    case 'close-sheet':closeSheet();break;
    case 'demo':openDemo(a.dataset.k);break;
    case 'form':openForm(a.dataset.k);break;
    case 'form-pick':$('#formIn').click();break;
    case 'day-prev':{const n=addDays(V.sel,-1);if(diffDays(S.start,n)>=0)V.sel=n;render();break}
    case 'day-next':{const n=addDays(V.sel,1);if(diffDays(S.start,n)<=83)V.sel=n;render();break}
    case 'day-today':initSel();render();break;
    case 'day-last':V.sel=addDays(S.start,83);render();break;
    case 'done':{const b=a.dataset.b;const before=dayDone(d);const E=ent(d);E.done[b]=!E.done[b];save();render();if(E.done[b])completeCheck(d,before);break}
    case 'feel':{const E=ent(d);const l=E.lifts[a.dataset.k]||(E.lifts[a.dataset.k]={reps:[]});l.eq=equipOf(a.dataset.k);l.feel=l.feel===a.dataset.v?undefined:a.dataset.v;save();render();break}
    case 'swim':case 'restchk':{const E=ent(d);const o=act==='swim'?E.swim:E.rest;o[a.dataset.i]=!o[a.dataset.i];save();render();break}
    case 'scale':{const E=ent(d);const k=a.dataset.k,v=+a.dataset.v;E[k]=E[k]===v?undefined:v;save();render();break}
    case 'pain':{const E=ent(d);E.pain=!E.pain;save();render();if(E.pain)toast('נרשם. כאב = עוצרים ומדברים עם מבוגר.');break}
    case 'easy-mode':{const E=ent(d);E.easyMode=!E.easyMode;save();render();toast(E.easyMode?'עברת לגרסה הקלה של היום':'חזרת לתוכנית של היום');break}
    case 'override':{const w=+a.dataset.w;if(S.override[w]==='plan')delete S.override[w];else S.override[w]='plan';save();render();break}
    case 'chk':S.checks[a.dataset.id]=!S.checks[a.dataset.id];save();render();break;
    case 'go-chat':go('chat');break;
    case 'live':if(L.on&&!(L.d===d&&L.bid===a.dataset.b)){liveEnd()}if(L.on&&L.d===d&&L.bid===a.dataset.b){go('live');break}liveStart(d,a.dataset.b);break;
    case 'live-free':liveStart(null,null,+a.dataset.w);break;
    case 'go-live':go('live');break;
    case 'l-toggle':liveToggle();break;
    case 'l-next':liveNext();break;
    case 'l-prev':livePrev();break;
    case 'l-exit':if(!V.exitArm){V.exitArm=true;render();setTimeout(()=>{V.exitArm=false;if(V.view==='live'&&L.on)render()},3000)}else{V.exitArm=false;liveEnd();go('today')}break;
    case 'l-w':{const s=L.steps[L.i];const x=s.x;const step=Math.abs(incOf(x.k))||1;const cur=liveWeight(x)??0;L.w[x.k]=Math.max(0,roundTo(cur+(+a.dataset.v)*step,step));render();break}
    case 'l-rep':{const s=L.steps[L.i];const inp=$('#lwIn');if(inp&&inp.value)L.w[s.x.k]=+inp.value;recordSet(L.d,s.x.k,s.s,+a.dataset.v,L.w[s.x.k]);beep(784,.12);if(!L.run){L.run=true;L.lastT=Date.now();wakeOn()}liveNext();break}
    case 'l-feel':{const s=L.steps[L.i];if(L.d){const E=ent(L.d);const l=E.lifts[s.x.k]||(E.lifts[s.x.k]={reps:[]});l.eq=equipOf(s.x.k);l.feel=a.dataset.v;save()}liveNext();break}
    case 'l-save':{if(L.d){const E=ent(L.d);const before=dayDone(L.d);const s=L.steps[L.i];
        if(s.kind==='run'){const km=parseFloat(($('#lKm')||{}).value);const sec=parseTime(($('#lSec')||{}).value);const r=E.runs[L.bid]||{};if(!isNaN(km)&&km>0)r.km=Math.min(60,km);if(sec)r.sec=sec;if(!r.src)r.src='live';E.runs[L.bid]=r}
        E.done[L.bid]=true;save();const dd=L.d;liveEnd();V.sel=dd;go('today');if(dayDone(dd))completeCheck(dd,before);else{confetti();fanfare();toast('אימון נשמר. כל הכבוד!')}}
      else{liveEnd();go('live');confetti()}break}
    case 'voice':S.cfg.voice=!S.cfg.voice;save();if(!$('#sheet').hidden)openSettings();render();if(S.cfg.voice)say('קול המאמן פעיל');else try{speechSynthesis.cancel()}catch(err){}break;
    case 'auto-rest':S.cfg.autoRest=!S.cfg.autoRest;save();openSettings();render();break;
    case 'rest-len':S.cfg.rest=+a.dataset.s;save();render();break;
    case 'cfg':{const k=a.dataset.k;S.cfg[k]=Math.max(0,Math.min(30,S.cfg[k]+ +a.dataset.v));save();render();break}
    case 'rest-add':R.endAt+=30000;paintPill();break;
    case 'rest-cancel':R.endAt=0;paintPill();break;
    case 'wk-prev':V.week=Math.max(1,V.week-1);render();break;
    case 'wk-next':V.week=Math.min(12,V.week+1);render();break;
    case 'wk-now':V.week=currentWeek();render();break;
    case 'wk-go':V.week=+a.dataset.w;go('week');break;
    case 'k10-fresh':S.k10Fresh=todayIso();save();render();break;
    case 'import':openImport('');break;
    case 'pick-files':$('#fileIn').click();break;
    case 'imp-save':saveImports();break;
    case 'chat-q':chatSend(a.dataset.q);break;
    case 'chat-stop':if(CH.ctl)CH.ctl.abort();break;
    case 'chat-clear':CH.turns=[];CH.err=null;saveChat();render();break;
    case 'copy-backup':{const txt=JSON.stringify(S);const ta=$('#backup');ta.value=txt;
      try{navigator.clipboard.writeText(txt).then(()=>toast('הגיבוי הועתק'),()=>{ta.select();toast('סמן והעתק את הטקסט')})}catch(err){ta.select();toast('סמן והעתק את הטקסט')}break}
    case 'import-backup':{try{const o=JSON.parse($('#backup').value);if(!o||!o.start||!o.days)throw 0;S=normalize(o);save();initSel();render();toast('הנתונים שוחזרו')}catch(err){toast('הטקסט לא נראה כמו גיבוי תקין. העתק אותו שוב במלואו.')}break}
    case 'open-settings':openSettings();break;
    case 'push-enable':enablePush();break;
    case 'push-test':navigator.serviceWorker.ready.then(r=>{writeStatus();setTimeout(()=>r.active&&r.active.postMessage({type:'test'}),400)});toast('נשלחה התראת בדיקה');break;
    case 'sb-login':sbLogin(false);break;
    case 'sb-signup':sbLogin(true);break;
    case 'sb-sync':sbPull().then(()=>toast(SYNC==='synced'?'מסונכרן':'אין חיבור כרגע'));break;
    case 'sb-logout':SB=null;sbStore();SYNC='local';paintSync();openSettings();toast('התנתקת. הנתונים נשארו גם במכשיר');break;
    case 'gq-save':{const v=(($('#gqIn')||{}).value||'').trim();if(!/^gsk_\w{20,}/.test(v)){toast('המפתח לא תקין');break}try{localStorage.setItem(GQ_LS,v)}catch(e){}SAMPLE=gqSample;openSettings();render();toast('המפתח נשמר במכשיר');aiReview(false);break}
    case 'gq-clear':try{localStorage.removeItem(GQ_LS)}catch(e){}SAMPLE=null;openSettings();render();toast('המפתח נמחק');break;
    case 'ai-run':aiReview(true);render();break;
    case 'ai-off':{const w=+a.dataset.w;if(S.ai&&S.ai[w]){S.ai[w].off=!S.ai[w].off;save();render()}break}
    case 'reset':if(!V.resetArm){V.resetArm=true;openSettings()}else{const st=S.start;S=defaults();S.start=st;save();closeSheet();initSel();render();toast('הנתונים אופסו')}break;
  }
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatin'&&!('ontouchstart' in window)){e.preventDefault();const v=e.target.value;e.target.value='';chatSend(v)}});
document.addEventListener('submit',e=>{if(e.target.id==='chatf'){e.preventDefault();const t=$('#chatin');const v=t.value;t.value='';chatSend(v)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.rkm){const E=ent(t.dataset.d);const r=E.runs[t.dataset.rkm]||(E.runs[t.dataset.rkm]={});const v=parseFloat(t.value);if(isNaN(v))delete r.km;else r.km=Math.max(0,Math.min(60,v));save();const p=$('#pace-'+t.dataset.rkm);if(p)p.innerHTML=paceText(r)}
  else if(t.dataset.rsec){const s=parseTime(t.value);if(s||!t.value.trim()){const E=ent(t.dataset.d);const r=E.runs[t.dataset.rsec]||(E.runs[t.dataset.rsec]={});if(s)r.sec=s;else delete r.sec;save();const p=$('#pace-'+t.dataset.rsec);if(p)p.innerHTML=paceText(r)}}
  else if(t.dataset.lw){const E=ent(t.dataset.d);const l=E.lifts[t.dataset.lw]||(E.lifts[t.dataset.lw]={reps:[]});l.eq=equipOf(t.dataset.lw);const v=parseFloat(t.value);if(isNaN(v))delete l.w;else l.w=v;save()}
  else if(t.dataset.note){ent(t.dataset.d).note=t.value;save()}
  else if(t.id==='chatin'){t.style.height='auto';t.style.height=Math.min(160,t.scrollHeight)+'px'}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.rep){const d=t.dataset.d,k=t.dataset.rep,s=+t.dataset.s;const v=parseInt(t.value,10);const wIn=document.querySelector(`[data-lw="${k}"][data-d="${d}"]`);
    if(isNaN(v)||v<=0){const E=ent(d);const l=E.lifts[k];if(l&&l.reps){l.reps[s]=0;save()}t.classList.remove('on');return}
    const finished=recordSet(d,k,s,v,wIn?wIn.value:null);t.classList.add('on');
    const li=$('#lift-'+k);if(li){const all=[...li.querySelectorAll('.rep')].every(x=>x.value);li.classList.toggle('full',all)}
    if(finished){render();return}
    if(S.cfg.autoRest)startRest(S.cfg.rest)}
  else if(t.dataset.eq){S.equip[t.dataset.eq]=t.value;save();render();toast(`ציוד עודכן: ${EQ[t.value].t}`)}
  else if(t.dataset.pr){const k=t.dataset.pr;const v=t.value.trim();if(!v){S.prs[k]='';save();render();return}const s=parseTime(v);if(s==null){toast('פורמט זמן: דקות:שניות, למשל 48:30');return}S.prs[k]=mmss(s);if(k==='k10')S.k10Fresh=todayIso();save();render();toast('השיא עודכן')}
  else if(t.id==='startDate'&&t.value){S.start=sundayOf(t.value);save();initSel();openSettings();render();toast(`התוכנית מתחילה ב-${fmtDM(S.start)}`)}
  else if(t.id==='fileIn'){handleFiles([...t.files]);t.value=''}
  else if(t.dataset.impuse!=null){IMPORTS[+t.dataset.impuse].use=t.checked;openImport('')}
  else if(t.dataset.imptgt!=null){IMPORTS[+t.dataset.imptgt].target=t.value}
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.matches&&t.matches('details[data-k]')){V.open[t.dataset.k]=t.open;const lb=t.querySelector('summary .linkbtn');if(lb)lb.textContent=t.open?'סגור':'למה?'}},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(L.on&&L.run)wakeOn();if(SB&&SYNC!=='saving')sbPull()}});

route();
initCloud();
initWebApp();
})();
</script>
